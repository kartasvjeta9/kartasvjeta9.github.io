<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Bussines | AI Web Solutions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --text: #f8fafc; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; line-height: 1.6; }
        header { background: #1e293b; padding: 1.5rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); }
        .btn { padding: 0.9rem 2rem; background: var(--primary); color: #0f172a; font-weight: bold; border-radius: 6px; cursor: pointer; border: none; }
        .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; padding: 3rem 5%; }
        .pricing-card { background: #1e293b; padding: 2.5rem; border-radius: 12px; }
        input, select { width: 100%; padding: 0.8rem; margin: 0.5rem 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
    </style>
</head>
<body>

<header>
    <div class="logo">Ai Bussines</div>
    <select id="main-lang-select" onchange="promijeniJezikSajta()">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="hr">Hrvatski</option>
        <option value="es">Español</option>
        <option value="it">Italiano</option>
    </select>
</header>

<section class="pricing" id="cijene">
    <div class="pricing-grid">
        <div class="pricing-card">
            <h3 id="p1-title">Free Template</h3>
            <div class="template-inputs">
                <input type="text" id="temp-naziv" placeholder="Naziv firme">
                <input type="text" id="temp-telefon" placeholder="Broj telefona">
                <input type="text" id="temp-insta" placeholder="Instagram profil">
                <select id="temp-jezik">
                    <option value="en">English</option>
                    <option value="de">Deutsch</option>
                    <option value="hr">Hrvatski</option>
                    <option value="es">Español</option>
                    <option value="it">Italiano</option>
                </select>
            </div>
            <button onclick="otvoriSajtUzivo()" class="btn" id="btn-generate">Generiši Sajt</button>
        </div>
    </div>
</section>

<script>
    var L = {
        en: { title: "Company Name", phone: "Phone Number", insta: "Instagram", gen: "Generate Website" },
        de: { title: "Firmenname", phone: "Telefonnummer", insta: "Instagram", gen: "Website generieren" },
        hr: { title: "Naziv firme", phone: "Broj telefona", insta: "Instagram", gen: "Generiši sajt" },
        es: { title: "Nombre de empresa", phone: "Número de teléfono", insta: "Instagram", gen: "Generar sitio" },
        it: { title: "Nome azienda", phone: "Numero di telefono", insta: "Instagram", gen: "Genera sito" }
    };

    function promijeniJezikSajta() {
        var lang = document.getElementById("main-lang-select").value;
        document.getElementById("temp-naziv").placeholder = L[lang].title;
        document.getElementById("temp-telefon").placeholder = L[lang].phone;
        document.getElementById("temp-insta").placeholder = L[lang].insta;
        document.getElementById("btn-generate").innerText = L[lang].gen;
        document.getElementById("temp-jezik").value = lang;
    }

    function otvoriSajtUzivo() {
        var naziv = document.getElementById('temp-naziv').value || "My Business";
        var lang = document.getElementById('temp-jezik').value;
        
        // Funkcija za prepoznavanje branše na engleskom (zbog univerzalnosti koda)
        var bransa = "general";
        var n = naziv.toLowerCase();
        if(n.includes("fish") || n.includes("riba")) bransa = "fish";
        if(n.includes("gym") || n.includes("teretana")) bransa = "gym";
        
        // Objekat sa sadržajem za sve jezike i branše
        var content = {
            fish: { en: "Fresh seafood!", de: "Frische Meeresfrüchte!", hr: "Sveža riba!" },
            gym: { en: "Fitness & Training!", de: "Fitness & Training!", hr: "Fitnes i trening!" },
            general: { en: "Professional Services", de: "Professionelle Dienstleistungen", hr: "Profesionalne usluge" }
        };

        var text = content[bransa][lang] || content["general"][lang];

        var win = window.open();
        win.document.write(`
            <html>
                <body style="background:#0f172a; color:white; text-align:center; padding:50px;">
                    <h1>${naziv}</h1>
                    <p>${text}</p>
                </body>
            </html>
        `);
    }
</script>
</body>
</html>
